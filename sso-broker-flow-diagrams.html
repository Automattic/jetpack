<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SSO Broker Flow Diagrams</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0a0a0f;
  --surface: #12121a;
  --border: #2a2a3a;
  --text: #e0e0ec;
  --text-muted: #8888a0;
  --blue: #4d7cff;
  --cyan: #38d9c4;
  --orange: #ff8c42;
  --red: #ff4d6a;
  --purple: #a57bff;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: var(--bg); color: var(--text); font-family: 'DM Mono', monospace; padding: 40px; }
h1 { font-family: 'Space Mono', monospace; font-size: 1.5rem; margin-bottom: 6px; }
.subtitle { color: var(--text-muted); font-size: 0.8rem; margin-bottom: 48px; }
.flow-section { margin-bottom: 56px; }
.flow-title {
  font-family: 'Space Mono', monospace; font-size: 1.05rem;
  margin-bottom: 20px; display: flex; align-items: center; gap: 12px;
}
.badge {
  font-size: 0.6rem; padding: 3px 10px; border-radius: 3px;
  font-weight: 700; letter-spacing: 1px; text-transform: uppercase;
}
.badge-current { background: rgba(77,124,255,0.15); color: var(--blue); border: 1px solid rgba(77,124,255,0.3); }
.badge-new { background: rgba(56,217,196,0.15); color: var(--cyan); border: 1px solid rgba(56,217,196,0.3); }
.flow-container {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: 8px; padding: 32px; overflow-x: auto;
}
.legend {
  display: flex; gap: 24px; flex-wrap: wrap; margin-top: 32px;
  padding: 16px; background: var(--surface); border: 1px solid var(--border); border-radius: 8px;
}
.legend-item { display: flex; align-items: center; gap: 8px; font-size: 0.7rem; color: var(--text-muted); }
.legend-swatch { width: 24px; height: 3px; border-radius: 2px; }
.legend-swatch.dashed { height: 0; border-top: 2px dashed; }
.legend-box { width: 16px; height: 16px; border-radius: 3px; }
</style>
</head>
<body>

<h1>Jetpack SSO &mdash; Broker Flow</h1>
<p class="subtitle">Current flow vs proposed CIAB broker flow &middot; missing components highlighted in red</p>

<div class="flow-section">
  <div class="flow-title">Current Flow <span class="badge badge-current">All Sites</span></div>
  <div class="flow-container"><div id="current"></div></div>
</div>

<div class="flow-section">
  <div class="flow-title">Proposed Broker Flow <span class="badge badge-new">CIAB Only</span></div>
  <div class="flow-container"><div id="proposed"></div></div>
</div>

<div class="legend">
  <div class="legend-item"><div class="legend-swatch" style="background:var(--blue)"></div>XML-RPC call</div>
  <div class="legend-item"><div class="legend-swatch" style="background:var(--purple)"></div>Browser redirect</div>
  <div class="legend-item"><div class="legend-swatch" style="background:var(--cyan)"></div>Response / data</div>
  <div class="legend-item"><div class="legend-swatch" style="background:var(--orange)"></div>MSD action</div>
  <div class="legend-item"><div class="legend-swatch dashed" style="border-top-color:var(--red)"></div>Missing / needs build</div>
  <div class="legend-item"><div class="legend-box" style="background:rgba(255,77,106,0.08);border:1px dashed rgba(255,77,106,0.4)"></div>Missing component</div>
</div>

<script>
const COLORS = { blue:'#4d7cff', cyan:'#38d9c4', purple:'#a57bff', orange:'#ff8c42', red:'#ff4d6a' };
const ACTOR_STYLES = {
  user:   { bg:'rgba(165,123,255,0.12)', stroke:'rgba(165,123,255,0.3)', text:'#a57bff' },
  garden: { bg:'rgba(56,217,196,0.12)',  stroke:'rgba(56,217,196,0.3)',  text:'#38d9c4' },
  wpcom:  { bg:'rgba(77,124,255,0.12)',  stroke:'rgba(77,124,255,0.3)',  text:'#4d7cff' },
  msd:    { bg:'rgba(255,140,66,0.12)',  stroke:'rgba(255,140,66,0.3)',  text:'#ff8c42' },
  'msd-missing': { bg:'rgba(255,77,106,0.08)', stroke:'rgba(255,77,106,0.4)', text:'#ff4d6a', dash:true },
};

function ns(tag) { return document.createElementNS('http://www.w3.org/2000/svg', tag); }
function txt(x, y, content, opts={}) {
  const t = ns('text');
  t.setAttribute('x', x); t.setAttribute('y', y);
  t.setAttribute('text-anchor', opts.anchor||'middle');
  t.setAttribute('fill', opts.fill||'#8888a0');
  t.setAttribute('font-size', opts.size||'9.5');
  t.setAttribute('font-family', 'DM Mono, monospace');
  if (opts.bold) t.setAttribute('font-weight', '700');
  t.textContent = content;
  return t;
}

function draw(id, actors, steps) {
  const COL = 220, HDR = 50, STEP_H = 62, PAD = 12;
  const W = actors.length * COL, H = HDR + PAD + steps.length * STEP_H + 20;
  const svg = ns('svg');
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.setAttribute('width', W); svg.setAttribute('height', H);
  svg.style.overflow = 'visible';
  const cx = i => i * COL + COL / 2;

  actors.forEach((a, i) => {
    const s = ACTOR_STYLES[a.type];
    const r = ns('rect');
    r.setAttribute('x', cx(i)-82); r.setAttribute('y', 4);
    r.setAttribute('width', 164); r.setAttribute('height', 32); r.setAttribute('rx', 5);
    r.setAttribute('fill', s.bg); r.setAttribute('stroke', s.stroke);
    if (s.dash) r.setAttribute('stroke-dasharray', '4 3');
    svg.appendChild(r);
    svg.appendChild(txt(cx(i), 25, a.label, { fill: s.text, size: '11', bold: true }));
    const ln = ns('line');
    ln.setAttribute('x1', cx(i)); ln.setAttribute('y1', HDR);
    ln.setAttribute('x2', cx(i)); ln.setAttribute('y2', H);
    ln.setAttribute('stroke', '#2a2a3a');
    if (s.dash) ln.setAttribute('stroke-dasharray', '4 3');
    svg.appendChild(ln);
  });

  steps.forEach((s, i) => {
    const y = HDR + PAD + i * STEP_H + STEP_H / 2;
    if (s.type === 'self') {
      const bx = cx(s.at);
      const r = ns('rect');
      r.setAttribute('x', bx-72); r.setAttribute('y', y-14);
      r.setAttribute('width', 144); r.setAttribute('height', 28); r.setAttribute('rx', 4);
      r.setAttribute('fill', s.missing ? 'rgba(255,77,106,0.08)' : '#1a1a26');
      r.setAttribute('stroke', s.missing ? 'rgba(255,77,106,0.4)' : '#2a2a3a');
      if (s.missing) r.setAttribute('stroke-dasharray', '4 3');
      svg.appendChild(r);
      svg.appendChild(txt(bx, y+4, s.label, { fill: s.missing ? '#ff4d6a' : '#8888a0', size: '9' }));
      return;
    }
    const x1 = cx(s.from), x2 = cx(s.to), right = x2 > x1, pad = 8;
    const lx1 = right ? x1+pad : x1-pad, lx2 = right ? x2-pad : x2+pad;
    const color = COLORS[s.color];
    const ln = ns('line');
    ln.setAttribute('x1', lx1); ln.setAttribute('y1', y);
    ln.setAttribute('x2', lx2); ln.setAttribute('y2', y);
    ln.setAttribute('stroke', color); ln.setAttribute('stroke-width', '2');
    if (s.dashed) ln.setAttribute('stroke-dasharray', '6 4');
    svg.appendChild(ln);
    const d = right ? -1 : 1;
    const ar = ns('polygon');
    ar.setAttribute('points', `${lx2},${y} ${lx2+d*8},${y-5} ${lx2+d*8},${y+5}`);
    ar.setAttribute('fill', color);
    svg.appendChild(ar);
    if (s.num) svg.appendChild(txt(Math.min(x1,x2)-18, y+3, s.num, { fill:'#555', size:'9', bold:true, anchor:'end' }));
    svg.appendChild(txt((x1+x2)/2, y-9, s.label, { fill: s.missing ? '#ff4d6a' : '#8888a0', size: '9.5', bold: !!s.missing }));
    if (s.sub) svg.appendChild(txt((x1+x2)/2, y+17, s.sub, { fill: s.missing ? '#ff4d6a' : '#555', size: '8' }));
  });

  document.getElementById(id).appendChild(svg);
}

draw('current',
  [{ label:'User (Browser)', type:'user' }, { label:'Garden wp-login.php', type:'garden' }, { label:'WordPress.com', type:'wpcom' }],
  [
    { num:'1', from:0, to:1, color:'purple', label:'Visit wp-login.php' },
    { num:'2', from:1, to:2, color:'blue',   label:'XML-RPC requestNonce' },
    { num:'3', from:2, to:1, color:'cyan',   label:'nonce (string)' },
    { type:'self', at:0, label:'Click "Log in with WP.com"' },
    { num:'4', from:1, to:2, color:'purple', label:'Redirect to wordpress.com/wp-login.php', sub:'?site_id & sso_nonce & calypso_auth' },
    { type:'self', at:2, label:'Authenticate via browser cookie' },
    { num:'5', from:2, to:1, color:'purple', label:'Redirect back to garden site', sub:'?action=jetpack-sso & result=success & user_id & sso_nonce' },
    { num:'6', from:1, to:2, color:'blue',   label:'XML-RPC validateResult(nonce, user_id)' },
    { num:'7', from:2, to:1, color:'cyan',   label:'User data object' },
    { num:'8', from:1, to:0, color:'cyan',   label:'Set auth cookie, redirect to wp-admin' },
  ]
);

draw('proposed',
  [{ label:'User (Browser)', type:'user' }, { label:'Garden wp-login.php', type:'garden' }, { label:'WordPress.com', type:'wpcom' }, { label:'MSD (my.woo.ai)', type:'msd-missing' }],
  [
    { num:'1',  from:0, to:1, color:'purple', label:'Visit wp-login.php' },
    { num:'2',  from:1, to:2, color:'blue',   label:'XML-RPC requestNonce' },
    { num:'3',  from:2, to:1, color:'cyan',   label:'{nonce, broker_url}', missing:true, sub:'NEEDS: WP.com endpoint update' },
    { type:'self', at:1, label:'Cache broker_url in transient (done)' },
    { type:'self', at:0, label:'Click "Log in with WP.com"' },
    { num:'4',  from:1, to:3, color:'purple', label:'Redirect to broker_url (done)', sub:'?site_id & sso_nonce & calypso_auth' },
    { type:'self', at:3, label:'Check OAuth session', missing:true },
    { num:'5',  from:3, to:2, color:'orange', label:'POST sso-authorize(nonce, OAuth token)', missing:true, dashed:true, sub:'NEEDS: new WP.com API + MSD handler' },
    { num:'6',  from:2, to:3, color:'cyan',   label:'Success + user_id', missing:true, dashed:true },
    { num:'7',  from:3, to:1, color:'purple', label:'Redirect back (same format as today)', sub:'?action=jetpack-sso & result=success & user_id & sso_nonce' },
    { num:'8',  from:1, to:2, color:'blue',   label:'XML-RPC validateResult (unchanged)' },
    { num:'9',  from:2, to:1, color:'cyan',   label:'User data object' },
    { num:'10', from:1, to:0, color:'cyan',   label:'Set auth cookie, redirect to wp-admin' },
  ]
);
</script>
</body>
</html>
