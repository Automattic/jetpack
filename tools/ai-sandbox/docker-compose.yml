version: '3.9'

services:
  jetpack-ai:
    build: .
    container_name: jetpack-ai-sandbox
    command: sleep infinity
    volumes:
      - ${HOME}/.claude:/home/dev/.claude
      - ../../:/home/dev/jetpack
      - jetpack_node_modules:/home/dev/jetpack/node_modules
    working_dir: /home/dev/jetpack
    stdin_open: true
    tty: true

volumes:
  jetpack_node_modules:
