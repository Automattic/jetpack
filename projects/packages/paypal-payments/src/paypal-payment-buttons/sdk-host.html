<!DOCTYPE html>
<!--
	Host document for the PayPal SDK in the block editor canvas.

	The canvas is a blob: document, so `location.host` is '' and the SDK's zoid
	layer cannot work out its own origin. The editor therefore nests an iframe
	pointing at this file — a real same-origin http(s) URL — and injects the SDK
	script into it. Nothing here runs: the editor owns the frame's contents.

	`margin: 0` matters. The frame is sized from a ResizeObserver on the container
	div, and body margins would make it 16px too short.
-->
<html lang="en">
	<head>
		<meta charset="utf-8" />
		<title>PayPal buttons preview</title>
		<style>
			body {
				margin: 0;
			}
		</style>
	</head>
	<body></body>
</html>
