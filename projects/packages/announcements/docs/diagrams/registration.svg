<svg viewBox="0 0 880 420" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="One request, read from top to bottom. Registrants hook the action as plugins load. After init, the first read of the registry fires jetpack_register_announcements, once per request. Each registrant calls register_announcement there. The registry accepts a well-formed record, sanitizes every field, and keeps it for the request. It refuses an id that is not vendor/slug, an id already registered, and a record without a date, a title or a channel, with a _doing_it_wrong notice and a false return. The callback does no I/O, and the current user is known by then, so a registrant can decide per user.">
  <defs>
    <marker id="arrow-reg" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 1 L 8 5 L 0 9 z" fill="#94a3b8"/>
    </marker>
  </defs>

  <rect x="6" y="6" width="868" height="408" rx="12" fill="#ffffff"/>

  <text x="440" y="36" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155">The registry asks once; every registrant answers.</text>

  <!-- One request -->
  <text x="140" y="62" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-weight="700" fill="#64748b">one request</text>

  <rect x="30" y="72" width="220" height="48" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="42" y="92" font-family="-apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#334155">plugins load</text>
  <text x="42" y="108" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-style="italic" fill="#94a3b8">registrants hook the action</text>

  <line x1="140" y1="120" x2="140" y2="130" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-reg)"/>

  <rect x="30" y="134" width="220" height="48" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="42" y="154" font-family="ui-monospace, SFMono-Regular, monospace" font-size="10.5" font-weight="700" fill="#334155">init</text>
  <text x="42" y="170" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-style="italic" fill="#94a3b8">no read counts before it</text>

  <line x1="140" y1="182" x2="140" y2="192" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-reg)"/>

  <rect x="30" y="196" width="220" height="48" rx="5" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.2"/>
  <text x="42" y="216" font-family="-apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#334155">first read of the registry</text>
  <text x="42" y="232" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-style="italic" fill="#94a3b8">the REST route, in practice</text>

  <line x1="140" y1="244" x2="140" y2="254" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-reg)"/>

  <rect x="30" y="258" width="220" height="48" rx="5" fill="#dff3ec" stroke="#1d6b5a" stroke-width="1.4"/>
  <text x="42" y="278" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9.5" font-weight="700" fill="#1d6b5a">jetpack_register_announcements</text>
  <text x="42" y="294" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-style="italic" fill="#64748b">fires once per request</text>

  <!-- Action to registrants -->
  <line x1="252" y1="282" x2="286" y2="282" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-reg)"/>

  <!-- Registrants -->
  <rect x="290" y="72" width="270" height="234" rx="9" fill="#fff3d0" stroke="#b07020" stroke-width="1.5"/>
  <text x="306" y="96" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700" fill="#855317">registrants</text>
  <text x="400" y="96" font-family="-apple-system, system-ui, sans-serif" font-size="10" font-style="italic" fill="#855317">any plugin, same action</text>

  <rect x="306" y="108" width="238" height="78" rx="5" fill="#ffffff" stroke="#b07020" stroke-width="1.2"/>
  <text x="318" y="126" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#855317">register_announcement(</text>
  <text x="330" y="141" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#855317">'my-plugin/new-reports',</text>
  <text x="330" y="156" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#855317">array( 'date' => …, 'title' => …,</text>
  <text x="330" y="171" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#855317">'channels' => … ) )</text>

  <rect x="306" y="196" width="238" height="62" rx="5" fill="#ffffff" stroke="#b07020" stroke-width="1.2"/>
  <text x="318" y="214" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#855317">register_announcement(</text>
  <text x="330" y="229" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#855317">'New Reports',</text>
  <text x="330" y="244" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#855317">array( … ) )</text>

  <text x="306" y="282" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-style="italic" fill="#855317">each call answers the record, or false</text>

  <!-- Registry -->
  <rect x="600" y="72" width="250" height="234" rx="9" fill="#fafbfc" stroke="#cbd5e1" stroke-width="1.4"/>
  <text x="616" y="96" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12.5" font-weight="700" fill="#1d6b5a">registry</text>
  <text x="688" y="96" font-family="-apple-system, system-ui, sans-serif" font-size="10" fill="#94a3b8">additive · per request</text>

  <!-- To the registry -->
  <line x1="546" y1="147" x2="612" y2="147" stroke="#94a3b8" stroke-width="1.5" marker-end="url(#arrow-reg)"/>
  <line x1="546" y1="227" x2="612" y2="227" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="4 3" marker-end="url(#arrow-reg)"/>

  <rect x="616" y="108" width="218" height="78" rx="5" fill="#ffffff" stroke="#1d6b5a" stroke-width="1.4"/>
  <text x="628" y="126" font-family="-apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#1d6b5a">accepted</text>
  <text x="628" y="143" font-family="ui-monospace, SFMono-Regular, monospace" font-size="9" fill="#475569">my-plugin/new-reports</text>
  <text x="628" y="159" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-style="italic" fill="#64748b">every field sanitized</text>
  <text x="628" y="173" font-family="-apple-system, system-ui, sans-serif" font-size="9" font-style="italic" fill="#64748b">kept for this request</text>

  <rect x="616" y="196" width="218" height="98" rx="5" fill="#ffffff" stroke="#94a3b8" stroke-width="1.2" stroke-dasharray="4 3"/>
  <text x="628" y="214" font-family="-apple-system, system-ui, sans-serif" font-size="10.5" font-weight="700" fill="#334155">refused</text>
  <text x="628" y="231" font-family="-apple-system, system-ui, sans-serif" font-size="9" fill="#64748b">an id that is not vendor/slug</text>
  <text x="628" y="245" font-family="-apple-system, system-ui, sans-serif" font-size="9" fill="#64748b">an id already registered</text>
  <text x="628" y="259" font-family="-apple-system, system-ui, sans-serif" font-size="9" fill="#64748b">no date, no title or no channel</text>
  <text x="628" y="280" font-family="ui-monospace, SFMono-Regular, monospace" font-size="8.5" font-weight="700" fill="#64748b">_doing_it_wrong() · false</text>

  <text x="440" y="336" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" font-style="italic" fill="#94a3b8">do no I/O in the callback: the request that fires the action is waiting for its answer</text>
  <text x="440" y="352" text-anchor="middle" font-family="-apple-system, system-ui, sans-serif" font-size="9.5" font-style="italic" fill="#94a3b8">the current user is known by then, so a registrant can decide per user</text>

  <text x="440" y="388" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, monospace" font-size="12" font-weight="700" fill="#855317">hook the action · call the helper · decide what is news</text>
</svg>
