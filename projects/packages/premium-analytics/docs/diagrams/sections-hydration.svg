<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 290" width="1160" height="290" role="img" aria-label="The first read of the section registry after init latches, fires the registration action once, the package registers its sections at priority 10 and a plugin at priority 20 after checking the slug, and register() refuses unnamespaced ids, duplicate ids and duplicate slugs.">
  <style>
    text { font: 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .title { font-weight: 600; }
    .muted { fill: #57606a; }
    .box { fill: #ffffff; stroke: #1f2328; stroke-width: 1.2; }
    .box-accent { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.4; }
    .box-muted { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .lane { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .edge { stroke: #1f2328; stroke-width: 1.3; fill: none; }
    .edge-dashed { stroke-dasharray: 5 4; }
    .arrowhead { fill: #1f2328; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .muted { fill: #8b949e; }
      .box { fill: #0d1117; stroke: #e6edf3; }
      .box-accent { fill: #0c2d6b; stroke: #58a6ff; }
      .box-muted { fill: #161b22; stroke: #6e7681; }
      .lane { fill: #161b22; stroke: #30363d; }
      .edge { stroke: #e6edf3; }
      .arrowhead { fill: #e6edf3; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>
  <rect class="box" x="20" y="100" width="180" height="84" rx="4"/>
  <text class="title" x="110" y="122" text-anchor="middle">first read</text>
  <text class="mono" x="110" y="138" text-anchor="middle">get_registered()</text>
  <text class="mono" x="110" y="154" text-anchor="middle">get_all_registered()</text>
  <text class="mono" x="110" y="170" text-anchor="middle">get_registered_by_slug()</text>
  <rect class="box" x="225" y="100" width="150" height="84" rx="4"/>
  <text class="title" x="300" y="122" text-anchor="middle">ensure_hydrated()</text>
  <text class="muted" x="300" y="138" text-anchor="middle">after init only</text>
  <text class="muted" x="300" y="154" text-anchor="middle">latch, then fire:</text>
  <text class="muted" x="300" y="170" text-anchor="middle">no re-entry</text>
  <rect class="box-accent" x="400" y="100" width="210" height="84" rx="4"/>
  <text class="title" x="505" y="122" text-anchor="middle">do_action(</text>
  <text class="mono" x="505" y="138" text-anchor="middle">jetpack_premium_analytics_</text>
  <text class="mono" x="505" y="154" text-anchor="middle">register_dashboard_sections,</text>
  <text class="mono" x="505" y="170" text-anchor="middle">$registry )</text>
  <rect class="box" x="640" y="30" width="260" height="64" rx="4"/>
  <text class="title" x="770" y="50" text-anchor="middle">priority 10, the package</text>
  <text class="mono" x="770" y="66" text-anchor="middle">register_default_dashboard_sections()</text>
  <text class="muted" x="770" y="82" text-anchor="middle">Traffic, Insights, Subscribers, Store</text>
  <rect class="box" x="640" y="140" width="260" height="80" rx="4"/>
  <text class="title" x="770" y="168" text-anchor="middle">priority 20, a plugin</text>
  <text class="mono" x="770" y="184" text-anchor="middle">get_registered_by_slug( … ) ? skip :</text>
  <text class="mono" x="770" y="200" text-anchor="middle">register_dashboard_section( … )</text>
  <rect class="box" x="930" y="100" width="210" height="100" rx="4"/>
  <text class="title" x="1035" y="122" text-anchor="middle">register()</text>
  <text class="muted" x="1035" y="138" text-anchor="middle">id is namespaced</text>
  <text class="muted" x="1035" y="154" text-anchor="middle">id not registered</text>
  <text class="muted" x="1035" y="170" text-anchor="middle">slug not registered</text>
  <text class="muted" x="1035" y="186" text-anchor="middle">else _doing_it_wrong(), false</text>
  <polyline class="edge" points="200,142 225,142" marker-end="url(#arrow)"/>
  <polyline class="edge" points="375,142 400,142" marker-end="url(#arrow)"/>
  <polyline class="edge" points="610,130 640,62" marker-end="url(#arrow)"/>
  <polyline class="edge" points="610,155 640,180" marker-end="url(#arrow)"/>
  <polyline class="edge" points="900,62 930,130" marker-end="url(#arrow)"/>
  <polyline class="edge" points="900,180 930,160" marker-end="url(#arrow)"/>
  <polyline class="edge edge-dashed" points="1035,200 1035,260 110,260 110,184" marker-end="url(#arrow)"/>
  <text class="muted" x="570" y="255" text-anchor="middle">the read then answers from the populated registry</text>
</svg>
