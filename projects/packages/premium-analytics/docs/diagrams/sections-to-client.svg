<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1120 450" width="1120" height="450" role="img" aria-label="The registry is filtered by availability and serialized by the sections REST route; the client reads it as the dashboardSection core-data entity and builds the navigation from it, while a slug list in the inline script data lets report routes redirect before any request.">
  <style>
    text { font: 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .title { font-weight: 600; }
    .muted { fill: #57606a; }
    .box { fill: #ffffff; stroke: #1f2328; stroke-width: 1.2; }
    .box-accent { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.4; }
    .box-muted { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .lane { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .edge { stroke: #1f2328; stroke-width: 1.3; fill: none; }
    .edge-dashed { stroke-dasharray: 5 4; }
    .arrowhead { fill: #1f2328; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .muted { fill: #8b949e; }
      .box { fill: #0d1117; stroke: #e6edf3; }
      .box-accent { fill: #0c2d6b; stroke: #58a6ff; }
      .box-muted { fill: #161b22; stroke: #6e7681; }
      .lane { fill: #161b22; stroke: #30363d; }
      .edge { stroke: #e6edf3; }
      .arrowhead { fill: #e6edf3; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>
  <rect class="lane" x="15" y="20" width="1090" height="190" rx="6"/>
  <text class="title" x="25" y="42" text-anchor="start">Server (PHP)</text>
  <rect class="lane" x="15" y="250" width="1090" height="185" rx="6"/>
  <text class="title" x="25" y="272" text-anchor="start">Client (SPA)</text>
  <rect class="box" x="30" y="70" width="190" height="90" rx="4"/>
  <text class="title" x="125" y="103" text-anchor="middle">Dashboard_Section_Registry</text>
  <text class="muted" x="125" y="119" text-anchor="middle">every registered</text>
  <text class="muted" x="125" y="135" text-anchor="middle">section</text>
  <rect class="box" x="245" y="70" width="250" height="90" rx="4"/>
  <text class="title" x="370" y="95" text-anchor="middle">get_available_dashboard_sections()</text>
  <text class="muted" x="370" y="111" text-anchor="middle">preview scope, then</text>
  <text class="muted" x="370" y="127" text-anchor="middle">the section's own is_available(),</text>
  <text class="muted" x="370" y="143" text-anchor="middle">sorted by order</text>
  <rect class="box" x="520" y="70" width="220" height="90" rx="4"/>
  <text class="title" x="630" y="95" text-anchor="middle">to_array()</text>
  <text class="muted" x="630" y="111" text-anchor="middle">id, slug, label, title, order</text>
  <text class="muted" x="630" y="127" text-anchor="middle">date_filter, date_filter_options</text>
  <text class="muted" x="630" y="143" text-anchor="middle">requires_sync, default_layout</text>
  <rect class="box-accent" x="765" y="70" width="150" height="90" rx="4"/>
  <text class="title" x="840" y="95" text-anchor="middle">REST route</text>
  <text class="mono" x="840" y="111" text-anchor="middle">GET /wpcom/v2/</text>
  <text class="mono" x="840" y="127" text-anchor="middle">dashboards/{name}/</text>
  <text class="mono" x="840" y="143" text-anchor="middle">sections</text>
  <rect class="box" x="940" y="70" width="150" height="90" rx="4"/>
  <text class="title" x="1015" y="95" text-anchor="middle">script data</text>
  <text class="mono" x="1015" y="111" text-anchor="middle">preview_sections</text>
  <text class="muted" x="1015" y="127" text-anchor="middle">slugs only, inline</text>
  <text class="muted" x="1015" y="143" text-anchor="middle">JetpackScriptData</text>
  <polyline class="edge" points="220,115 245,115" marker-end="url(#arrow)"/>
  <polyline class="edge" points="495,115 520,115" marker-end="url(#arrow)"/>
  <polyline class="edge" points="740,115 765,115" marker-end="url(#arrow)"/>
  <polyline class="edge" points="370,70 370,50 1015,50 1015,70" marker-end="url(#arrow)"/>
  <text class="muted" x="700" y="45" text-anchor="middle">slugs of the same sections</text>
  <rect class="box" x="245" y="290" width="250" height="100" rx="4"/>
  <text class="title" x="370" y="320" text-anchor="middle">core-data entity dashboardSection</text>
  <text class="muted" x="370" y="336" text-anchor="middle">registered by the init module</text>
  <text class="muted" x="370" y="352" text-anchor="middle">key: slug</text>
  <text class="muted" x="370" y="368" text-anchor="middle">baseURL: the route above</text>
  <rect class="box" x="520" y="290" width="220" height="100" rx="4"/>
  <text class="title" x="630" y="312" text-anchor="middle">useDashboardSections()</text>
  <text class="mono" x="630" y="328" text-anchor="middle">useEntityRecords( 'root',</text>
  <text class="mono" x="630" y="344" text-anchor="middle">'dashboardSection',</text>
  <text class="mono" x="630" y="360" text-anchor="middle">{ per_page: -1 } )</text>
  <text class="muted" x="630" y="376" text-anchor="middle">sections + hasResolved</text>
  <rect class="box" x="765" y="290" width="150" height="100" rx="4"/>
  <text class="title" x="840" y="320" text-anchor="middle">stage.tsx</text>
  <text class="muted" x="840" y="336" text-anchor="middle">navigation: slug, label</text>
  <text class="muted" x="840" y="352" text-anchor="middle">?section= deep link</text>
  <text class="muted" x="840" y="368" text-anchor="middle">default_layout fallback</text>
  <rect class="box" x="940" y="290" width="150" height="100" rx="4"/>
  <text class="title" x="1015" y="320" text-anchor="middle">report routes</text>
  <text class="mono" x="1015" y="336" text-anchor="middle">isDashboardSection</text>
  <text class="mono" x="1015" y="352" text-anchor="middle">InPreviewScope()</text>
  <text class="muted" x="1015" y="368" text-anchor="middle">redirect if hidden</text>
  <line class="edge edge-dashed" x1="15" y1="230" x2="1105" y2="230"/>
  <text class="muted" x="25" y="226" text-anchor="start">HTTP</text>
  <polyline class="edge" points="840,160 840,230 370,230 370,290" marker-end="url(#arrow)"/>
  <text class="muted" x="605" y="245" text-anchor="middle">JSON array, one object per available section</text>
  <polyline class="edge" points="495,340 520,340" marker-end="url(#arrow)"/>
  <polyline class="edge" points="740,340 765,340" marker-end="url(#arrow)"/>
  <polyline class="edge edge-dashed" points="1015,160 1015,290" marker-end="url(#arrow)"/>
  <text class="muted" x="1045" y="245" text-anchor="middle">inline</text>
</svg>
