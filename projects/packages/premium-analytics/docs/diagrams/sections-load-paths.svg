<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 440" width="1100" height="440" role="img" aria-label="The three section files load at plugin load in wp-admin and on rest_api_init on REST and on WordPress.com Simple; on every path the registry hydrates on its first read after init and fires the registration action.">
  <style>
    text { font: 12px ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #1f2328; }
    .mono { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 11px; }
    .title { font-weight: 600; }
    .muted { fill: #57606a; }
    .box { fill: #ffffff; stroke: #1f2328; stroke-width: 1.2; }
    .box-accent { fill: #ddf4ff; stroke: #0969da; stroke-width: 1.4; }
    .box-muted { fill: #f6f8fa; stroke: #8c959f; stroke-width: 1.2; stroke-dasharray: 4 3; }
    .lane { fill: #f6f8fa; stroke: #d0d7de; stroke-width: 1; }
    .edge { stroke: #1f2328; stroke-width: 1.3; fill: none; }
    .edge-dashed { stroke-dasharray: 5 4; }
    .arrowhead { fill: #1f2328; }
    @media (prefers-color-scheme: dark) {
      text { fill: #e6edf3; }
      .muted { fill: #8b949e; }
      .box { fill: #0d1117; stroke: #e6edf3; }
      .box-accent { fill: #0c2d6b; stroke: #58a6ff; }
      .box-muted { fill: #161b22; stroke: #6e7681; }
      .lane { fill: #161b22; stroke: #30363d; }
      .edge { stroke: #e6edf3; }
      .arrowhead { fill: #e6edf3; }
    }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path class="arrowhead" d="M 0 0 L 10 5 L 0 10 z"/>
    </marker>
  </defs>
  <rect class="lane" x="15" y="30" width="1070" height="80" rx="6"/>
  <text class="title" x="25" y="64" text-anchor="start">wp-admin page</text>
  <text class="muted" x="25" y="82" text-anchor="start">connected site</text>
  <rect class="box" x="175" y="42" width="250" height="56" rx="4"/>
  <text class="title" x="300" y="66" text-anchor="middle">Analytics::init()</text>
  <text class="mono" x="300" y="82" text-anchor="middle">load_dashboard_components()</text>
  <rect class="box" x="445" y="42" width="140" height="56" rx="4"/>
  <text class="title" x="515" y="66" text-anchor="middle">at plugin load</text>
  <text class="muted" x="515" y="82" text-anchor="middle">before init</text>
  <rect class="box" x="840" y="42" width="150" height="56" rx="4"/>
  <text class="title" x="915" y="66" text-anchor="middle">script data filter</text>
  <text class="mono" x="915" y="82" text-anchor="middle">preview_sections</text>
  <polyline class="edge" points="425,70 445,70" marker-end="url(#arrow)"/>
  <polyline class="edge" points="585,70 605,70" marker-end="url(#arrow)"/>
  <polyline class="edge" points="820,70 840,70" marker-end="url(#arrow)"/>
  <polyline class="edge" points="990,70 1050,70"/>
  <rect class="lane" x="15" y="140" width="1070" height="80" rx="6"/>
  <text class="title" x="25" y="174" text-anchor="start">REST request</text>
  <text class="muted" x="25" y="192" text-anchor="start">connected site</text>
  <rect class="box" x="175" y="152" width="250" height="56" rx="4"/>
  <text class="title" x="300" y="176" text-anchor="middle">Dashboard_Support_Routes</text>
  <text class="mono" x="300" y="192" text-anchor="middle">::register()</text>
  <rect class="box" x="445" y="152" width="140" height="56" rx="4"/>
  <text class="title" x="515" y="176" text-anchor="middle">boot_routes()</text>
  <text class="muted" x="515" y="192" text-anchor="middle">on rest_api_init</text>
  <rect class="box" x="840" y="152" width="150" height="56" rx="4"/>
  <text class="title" x="915" y="176" text-anchor="middle">sections route</text>
  <text class="mono" x="915" y="192" text-anchor="middle">GET …/sections</text>
  <polyline class="edge" points="425,180 445,180" marker-end="url(#arrow)"/>
  <polyline class="edge" points="585,180 605,180" marker-end="url(#arrow)"/>
  <polyline class="edge" points="820,180 840,180" marker-end="url(#arrow)"/>
  <polyline class="edge" points="990,180 1050,180"/>
  <rect class="lane" x="15" y="250" width="1070" height="80" rx="6"/>
  <text class="title" x="25" y="284" text-anchor="start">WordPress.com Simple</text>
  <text class="muted" x="25" y="302" text-anchor="start">public-api process</text>
  <rect class="box" x="175" y="262" width="250" height="56" rx="4"/>
  <text class="title" x="300" y="286" text-anchor="middle">wpcom endpoint loader</text>
  <text class="mono" x="300" y="302" text-anchor="middle">Dashboard_Support_Routes::register()</text>
  <rect class="box" x="445" y="262" width="140" height="56" rx="4"/>
  <text class="title" x="515" y="286" text-anchor="middle">boot_routes()</text>
  <text class="muted" x="515" y="302" text-anchor="middle">on rest_api_init</text>
  <rect class="box" x="840" y="262" width="150" height="56" rx="4"/>
  <text class="title" x="915" y="286" text-anchor="middle">sections route</text>
  <text class="muted" x="915" y="302" text-anchor="middle">through public-api</text>
  <polyline class="edge" points="425,290 445,290" marker-end="url(#arrow)"/>
  <polyline class="edge" points="585,290 605,290" marker-end="url(#arrow)"/>
  <polyline class="edge" points="820,290 840,290" marker-end="url(#arrow)"/>
  <polyline class="edge" points="990,290 1050,290"/>
  <rect class="box" x="605" y="30" width="215" height="300" rx="4"/>
  <text class="title" x="712" y="144" text-anchor="middle">the three section files</text>
  <text class="mono" x="712" y="160" text-anchor="middle">dashboard-layout.php</text>
  <text class="mono" x="712" y="176" text-anchor="middle">dashboard-sections.php</text>
  <text class="mono" x="712" y="192" text-anchor="middle">default-dashboard-sections.php</text>
  <text class="muted" x="712" y="208" text-anchor="middle">guarded require_once</text>
  <text class="muted" x="712" y="224" text-anchor="middle">same files, three moments</text>
  <polyline class="edge" points="1050,70 1050,372" marker-end="url(#arrow)"/>
  <rect class="box-accent" x="175" y="372" width="910" height="50" rx="4"/>
  <text class="title" x="630" y="393" text-anchor="middle">every path: the first read after init hydrates the registry</text>
  <text class="mono" x="630" y="409" text-anchor="middle">ensure_hydrated() latches, then do_action( 'jetpack_premium_analytics_register_dashboard_sections', $registry )</text>
</svg>
