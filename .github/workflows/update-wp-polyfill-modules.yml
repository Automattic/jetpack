name: Update wp-polyfill modules
on:
  workflow_dispatch:
  schedule:
    - cron: '41 3 * * 1'
concurrency:
  group: update-wp-polyfill-modules-${{ github.ref }}

# Pushing and opening the PR use secrets.API_TOKEN_GITHUB, so no need for permissions.
permissions: {}

env:
  GIT_AUTHOR_NAME: matticbot
  GIT_AUTHOR_EMAIL: matticbot@users.noreply.github.com
  GIT_COMMITTER_NAME: matticbot
  GIT_COMMITTER_EMAIL: matticbot@users.noreply.github.com

jobs:
  update:
    name: Update wp-polyfill modules
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Use the matticbot token so CI runs on the created PR.
          token: ${{ secrets.API_TOKEN_GITHUB }}

      - name: Setup tools
        uses: $/.github/actions/tool-setup
        with:
          php: false

      - name: Regenerate the module list
        run: node projects/js-packages/webpack-config/tools/update-wp-polyfill-modules.mjs

      - name: Create or update the PR
        env:
          GH_TOKEN: ${{ secrets.API_TOKEN_GITHUB }}
        run: |
          .github/files/create-or-update-pr.sh \
            --branch update/wp-polyfill-modules \
            --title 'webpack-config: Update wp-polyfill modules' \
            --body 'The `wp-polyfill` script in a supported WordPress release contains a different set of polyfills, so this updates the list the Babel preset uses to decide when to depend on it. This PR was automatically generated by the "Update wp-polyfill modules" workflow. If closed, it will be recreated the next time the workflow finds changes.' \
            --label '[Pri] Normal' --label 'Task' --label '[Status] Needs Review' --label '[Type] Janitorial' \
            --reviewer Automattic/jetpack-monorepo \
            --changelog 'Babel preset: Update the list of polyfills that WordPress includes in `wp-polyfill`.' \
            -- projects/js-packages/webpack-config/src/babel/wp-polyfill-modules.json
