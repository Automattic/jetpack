name: Slack Charts PR notification
on:
  pull_request_target:
    types: [ opened, ready_for_review ]
    paths:
      - 'projects/js-packages/charts/**'

permissions:
  # gh api repos/{owner}/{repo}/issues/{number}/timeline
  pull-requests: read

jobs:
  notify:
    name: Notify
    runs-on: ubuntu-latest
    timeout-minutes: 5 # 2026-10-14: Takes a few seconds.
    if: ${{ ! github.event.pull_request.draft && github.event.pull_request.head.repo.full_name == github.repository }}

    steps:
      - name: Check the PR was never ready before
        id: first-ready
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          # A PR converted back to draft was already announced when it first became ready.
          DRAFT_EVENTS="$( gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/timeline" --jq '.[] | select( .event == "convert_to_draft" ) | .event' )"
          if [[ -z "$DRAFT_EVENTS" ]]; then
            echo "first=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Generate payload
        if: steps.first-ready.outputs.first == 'true'
        id: payload
        run: |
          PAYLOAD="$(
            jq -c '.pull_request | {
              title: .title,
              url: .html_url,
              author: .user.login,
            }' "$GITHUB_EVENT_PATH"
          )"
          echo "payload=$PAYLOAD" >> "$GITHUB_OUTPUT"

      - name: Send payload to the charts Slack workflow
        if: steps.first-ready.outputs.first == 'true'
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          webhook: ${{ secrets.SLACK_CHARTS_PR_WEBHOOK }}
          webhook-type: webhook-trigger
          payload: ${{ steps.payload.outputs.payload }}
