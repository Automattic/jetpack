name: Slack Charts PR notification
on:
  pull_request_target:
    types: [ opened, ready_for_review ]
    paths:
      - 'projects/js-packages/charts/**'

permissions: {}

jobs:
  notify:
    name: Notify
    runs-on: ubuntu-latest
    timeout-minutes: 5 # 2026-10-14: Takes a few seconds.
    if: ${{ ! github.event.pull_request.draft }}

    steps:
      - name: Generate message
        id: message
        env:
          SLACK_CHARTS_CHANNEL: C081YUPEVDF
        run: |
          MESSAGE="$(
            jq -nc --arg C "$SLACK_CHARTS_CHANNEL" --slurpfile event "$GITHUB_EVENT_PATH" '$event[0].pull_request as $pr | {
              channel: $C,
              text: ":pr: A charts PR is ready for review: \( $pr.title ) by \( $pr.user.login ) \( $pr.html_url )",
              blocks: [
                {
                  type: "section",
                  text: {
                    type: "mrkdwn",
                    text: ":pr: A charts PR is ready for review: <\( $pr.html_url )|\( $pr.title | gsub( "&"; "&amp;" ) | gsub( "<"; "&lt;" ) | gsub( ">"; "&gt;" ) )> by \( $pr.user.login )",
                  },
                }
              ],
            }'
          )"
          echo "message=$MESSAGE" >> "$GITHUB_OUTPUT"

      - name: Send message to charts channel
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d # v4.0.0
        with:
          token: ${{ secrets.SLACK_TOKEN }}
          method: chat.postMessage
          payload: ${{ steps.message.outputs.message }}
