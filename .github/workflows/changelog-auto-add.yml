# This workflow auto-generates changelog entries using GitHub Models when the
# "Generate changelog entries" checkbox is checked in the PR template.
#
# It triggers on pull_request_target so it can access repository secrets.
#
# Security: the default checkout is the base branch (trunk). Tool setup,
# the PHP detection script, and composer.json reads all come from trusted
# code. The PR branch is checked out at a separate path (./pr-checkout)
# only after all detection is done, and only so changelog files can be
# written there and pushed. No code from the PR is ever executed.

name: Changelog Auto-Add

on:
  pull_request_target:
    types: [opened, synchronize, edited]

concurrency:
  group: changelog-auto-add-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  models: read

jobs:
  generate:
    name: Generate changelog entries
    # Only run for same-repo branches (not forks) and skip bot PRs.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'renovate[bot]' &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'matticbot'
    runs-on: ubuntu-latest
    # Changelog generation typically completes in 1-3 minutes.
    # Transient API timeouts may occur; re-run the job or push a new commit to retry.
    timeout-minutes: 10

    steps:
      - name: Check for changelog checkbox
        id: checkbox
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: |
          if echo "$PR_BODY" | grep -qP '\[x\] Generate changelog entries'; then
            echo "checked=true" >> "$GITHUB_OUTPUT"
          else
            echo "checked=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout default branch
        if: steps.checkbox.outputs.checked == 'true'
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Deepen to merge base
        if: steps.checkbox.outputs.checked == 'true'
        uses: ./.github/actions/deepen-to-merge-base
        with:
          checkout: false

      - name: Setup tools
        if: steps.checkbox.outputs.checked == 'true'
        uses: ./.github/actions/tool-setup

      - name: Install monorepo dependencies
        if: steps.checkbox.outputs.checked == 'true'
        run: pnpm install

      - name: Prepare changelogger
        if: steps.checkbox.outputs.checked == 'true'
        run: composer update
        working-directory: projects/packages/changelogger

      - name: Check which projects need changelog entries
        if: steps.checkbox.outputs.checked == 'true'
        id: check
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          source .github/files/gh-funcs.sh
          PROJECTS=$(php tools/check-changelogger-use.php --list "$BASE" "$HEAD" 2>/dev/null || true)
          if [ -z "$PROJECTS" ]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            echo "No projects need changelog entries."
          else
            echo "needed=true" >> "$GITHUB_OUTPUT"
            gh_set_output projects "$PROJECTS"
            echo "Projects needing changelog entries:"
            echo "$PROJECTS"
          fi

      - name: Compute dependent plugins
        if: steps.checkbox.outputs.checked == 'true' && steps.check.outputs.needed == 'true'
        id: deps
        env:
          PROJECTS: ${{ steps.check.outputs.projects }}
        run: |
          source .github/files/gh-funcs.sh
          DEPS=""
          while IFS= read -r proj; do
            [ -z "$proj" ] && continue
            PLUGIN_DEPS=$(pnpm jetpack dependencies list "$proj" --add-dependents --no-dev --extra build 2>/dev/null | grep '^plugins/' || true)
            if [ -n "$PLUGIN_DEPS" ]; then
              DEPS="${DEPS}${proj}:${PLUGIN_DEPS}"$'\n'
            fi
          done <<< "$PROJECTS"
          gh_set_output plugin_deps "$DEPS"

      - name: Prepare prompt input
        if: steps.checkbox.outputs.checked == 'true' && steps.check.outputs.needed == 'true'
        id: prepare
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PROJECTS: ${{ steps.check.outputs.projects }}
          PLUGIN_DEPS: ${{ steps.deps.outputs.plugin_deps }}
          PR_DESCRIPTION: ${{ github.event.pull_request.body }}
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: .github/files/changelog-prepare-input.sh

      - name: Comment on large diff
        if: >-
          steps.checkbox.outputs.checked == 'true' &&
          steps.check.outputs.needed == 'true' &&
          steps.prepare.outputs.too_large == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          gh pr comment "$PR_NUMBER" \
            --body "This PR's diff is too large for automated changelog generation. Please add changelog entries manually using the changelogger CLI."

      - name: Generate changelog entries with AI
        if: >-
          steps.checkbox.outputs.checked == 'true' &&
          steps.check.outputs.needed == 'true' &&
          steps.prepare.outputs.too_large != 'true'
        id: ai
        uses: actions/ai-inference@v1
        with:
          prompt-file: .github/prompts/changelog-generate.prompt.yml
          max-tokens: 4000
          file_input: |
            diff: ${{ steps.prepare.outputs.diff_file }}
            projects: ${{ steps.prepare.outputs.projects_file }}
            plugin_deps: ${{ steps.prepare.outputs.deps_file }}
            pr_description: ${{ steps.prepare.outputs.pr_desc_file }}
            project_types: ${{ steps.prepare.outputs.types_file }}
            pr_title: ${{ steps.prepare.outputs.pr_title_file }}
            pr_number: ${{ steps.prepare.outputs.pr_number_file }}

      - name: Checkout PR branch
        if: >-
          steps.checkbox.outputs.checked == 'true' &&
          steps.check.outputs.needed == 'true' &&
          steps.prepare.outputs.too_large != 'true'
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          repository: ${{ github.event.pull_request.head.repo.full_name }}
          # DO NOT run any code in this checkout. Not even an `npm install`.
          path: ./pr-checkout
          token: ${{ secrets.API_TOKEN_GITHUB }}

      - name: Create changelog entries and push
        if: >-
          steps.checkbox.outputs.checked == 'true' &&
          steps.check.outputs.needed == 'true' &&
          steps.prepare.outputs.too_large != 'true'
        env:
          RESPONSE: ${{ steps.ai.outputs.response }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          CHANGELOGGER: ${{ github.workspace }}/projects/packages/changelogger/vendor/bin/changelogger
          KNOWN_PROJECTS: ${{ steps.check.outputs.projects }}
        run: .github/files/changelog-create-entries.sh
