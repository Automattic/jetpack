name: Update Phan stubs
on:
  workflow_dispatch:
  schedule:
    - cron: '22 0 * * 1,2,3,4,5'
concurrency:
  group: update-phan-stubs-${{ github.ref }}

# We use secrets.STUB_UPDATE_TOKEN_GITHUB for everything here (other than some public API queries against other repos), so no need for permissions.
permissions: {}

env:
  GIT_AUTHOR_NAME: matticbot
  GIT_AUTHOR_EMAIL: matticbot@users.noreply.github.com
  GIT_COMMITTER_NAME: matticbot
  GIT_COMMITTER_EMAIL: matticbot@users.noreply.github.com

jobs:
  update-stubs:
    name: Update stubs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          # Use the matticbot token so CI runs on the created PR.
          token: ${{ secrets.STUB_UPDATE_TOKEN_GITHUB }}

      - name: Setup tools
        uses: $/.github/actions/tool-setup
        with:
          node: false

      - name: Update stubs
        env:
          # Generic token is fine here.
          GH_TOKEN: ${{ github.token }}
        run: tools/stubs/update-stubs.sh

      - name: Create Phan update PR
        env:
          GH_TOKEN: ${{ secrets.STUB_UPDATE_TOKEN_GITHUB }}
        run: |
          PATHS=( .phan/stubs composer.lock )
          if ! [[ "$(date +%e)" -le 7 && "$(date +%A)" == Thursday ]] && git diff --quiet --exit-code --ignore-matching-lines='^ \* Stubs automatically generated from' -- "${PATHS[@]}"; then
            echo "::notice::No changes (other than version bumps) and it's not the first Thursday"
            exit 0
          fi
          .github/files/create-or-update-pr.sh \
            --branch update/phan-custom-stubs \
            --title 'phan: Update custom stubs' \
            --body 'This is an automatic update generated by a GitHub Action. If closed it will be recreated the next time the action runs.' \
            --label '[Pri] Normal' --label 'Task' --label '[Status] Needs Review' --label '[Type] Janitorial' \
            -- "${PATHS[@]}"
