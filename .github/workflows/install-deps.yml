name: Install JS Dependencies (Reusable)

# This is a reusable workflow. Callers: linting.yml, build.yml.
# It installs pnpm workspace dependencies once and saves them to a run-scoped
# GitHub Actions cache. Consumer jobs in the calling workflow restore from that
# cache instead of running their own pnpm install.
#
# Because GitHub Actions reusable workflows share the `github` context with the
# calling workflow, `github.run_id` inside this workflow is the SAME as the
# caller's run_id. This means the cache key is consistent across jobs in the
# calling workflow.

on:
  workflow_call:

permissions:
  # actions/checkout
  contents: read

jobs:
  install:
    name: Install JS dependencies (shared)
    runs-on: ubuntu-latest
    timeout-minutes: 5  # 2026-04-16: Should take about 1-2 minutes.

    steps:
      - uses: actions/checkout@v6

      - name: Setup tools (Node only)
        uses: ./.github/actions/tool-setup
        with:
          php: false

      # Cross-run cache: share node_modules across workflow runs with the same lockfile.
      # When trunk is up to date and lockfile is unchanged, consecutive PRs hit this cache
      # and skip the install entirely (0 actual installs on warm cache).
      - name: Restore cross-run node_modules cache
        id: xr-cache-restore
        uses: actions/cache/restore@v4
        with:
          path: |
            node_modules
            projects/*/*/node_modules
            projects/plugins/*/tests/e2e/node_modules
            tools/cli/node_modules
            tools/e2e-commons/node_modules
            tools/js-tools/node_modules
            tools/performance/node_modules
            .github/files/coverage-munger/node_modules
          key: pnpm-workspace-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install dependencies (only on cross-run cache miss)
        if: steps.xr-cache-restore.outputs.cache-hit != 'true'
        timeout-minutes: 5
        run: |
          pnpm install --frozen-lockfile --prefer-offline

      - name: Save cross-run cache (enables future workflow runs to skip install)
        if: steps.xr-cache-restore.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            projects/*/*/node_modules
            projects/plugins/*/tests/e2e/node_modules
            tools/cli/node_modules
            tools/e2e-commons/node_modules
            tools/js-tools/node_modules
            tools/performance/node_modules
            .github/files/coverage-munger/node_modules
          key: pnpm-workspace-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Save within-run cache (for consumer jobs in this workflow run)
        uses: actions/cache/save@v4
        with:
          path: |
            node_modules
            projects/*/*/node_modules
            projects/plugins/*/tests/e2e/node_modules
            tools/cli/node_modules
            tools/e2e-commons/node_modules
            tools/js-tools/node_modules
            tools/performance/node_modules
            .github/files/coverage-munger/node_modules
          key: pnpm-workspace-${{ github.run_id }}-${{ hashFiles('pnpm-lock.yaml') }}
