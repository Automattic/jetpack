          echo "    - Token is empty"
        else
          echo "    - Token is present (First 4 chars): ${GITHUB_TOKEN:0:4}..."
        fi
        
        echo "========================================"
        # List secrets if available in env (optional, dangerous)
        printenv
      shell: bash
